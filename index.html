<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Cinta</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
    color:#ff3b7f;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#ff4d88;
    color:white;
}

#no{
    background:#777;
    color:white;
    position:absolute;
}
</style>

</head>
<body>

<div class="box">
    <h1>Maukah Kamu Jadi Pacarku? ❤️</h1>

    <button id="yes" onclick="iya()">Ya ❤️</button>
    <button id="no">Tidak</button>
</div>

<script>

const no=document.getElementById("no");

function pindah(){
    no.style.left=Math.random()*(window.innerWidth-100)+"px";
    no.style.top=Math.random()*(window.innerHeight-60)+"px";
}

no.addEventListener("mouseover",pindah);
no.addEventListener("touchstart",function(e){
    e.preventDefault();
    pindah();
});

function iya(){
    document.body.innerHTML=`
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;text-align:center;">
        <div>
            <h1>❤️ Yeay!! ❤️</h1>
            <h2>Sekarang kita resmi jadi pasangan! >~< </h2>
        </div>
    </div>
    `;
}

</script>

</body>
</html>
